<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="360" fill="#ffffff"/>
  <!-- clients -->
  <g>
    <rect x="20" y="40" width="180" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="64" text-anchor="middle" font-weight="600">Web dashboard</text>
    <text x="110" y="83" text-anchor="middle" fill="#475569" font-size="12">any browser</text>
    <rect x="20" y="124" width="180" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="148" text-anchor="middle" font-weight="600">Scripts / Home Assistant</text>
    <text x="110" y="167" text-anchor="middle" fill="#475569" font-size="12">REST + SSE stream</text>
    <rect x="20" y="208" width="180" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="232" text-anchor="middle" font-weight="600">Prometheus / Grafana</text>
    <text x="110" y="251" text-anchor="middle" fill="#475569" font-size="12">GET /metrics</text>
    <rect x="20" y="292" width="180" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="321" text-anchor="middle" font-weight="600">kasadeluxe CLI</text>
  </g>
  <!-- server -->
  <rect x="260" y="20" width="400" height="330" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="460" y="44" text-anchor="middle" font-weight="700">kasadeluxe server (FastAPI)</text>
  <rect x="285" y="62" width="350" height="50" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="460" y="84" text-anchor="middle" font-weight="600">HTTP API · SSE · /metrics · static UI</text>
  <text x="460" y="102" text-anchor="middle" fill="#475569" font-size="12">optional Bearer token</text>
  <rect x="285" y="132" width="165" height="70" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="367" y="160" text-anchor="middle" font-weight="600">Poller</text>
  <text x="367" y="179" text-anchor="middle" fill="#475569" font-size="12">every 5 s, backoff,</text>
  <text x="367" y="194" text-anchor="middle" fill="#475569" font-size="12">pauses on bad password</text>
  <rect x="470" y="132" width="165" height="70" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="552" y="160" text-anchor="middle" font-weight="600">SQLite store</text>
  <text x="552" y="179" text-anchor="middle" fill="#475569" font-size="12">samples + activity log</text>
  <text x="552" y="194" text-anchor="middle" fill="#475569" font-size="12">90-day retention</text>
  <rect x="285" y="222" width="350" height="48" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="460" y="243" text-anchor="middle" font-weight="600">SmartPlug: SMART commands</text>
  <text x="460" y="260" text-anchor="middle" fill="#475569" font-size="12">get_emeter_data, set_device_info, schedules, LED, ...</text>
  <rect x="285" y="286" width="350" height="48" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="460" y="307" text-anchor="middle" font-weight="600">TpapTransport: SPAKE2+ login + AES-CCM</text>
  <text x="460" y="324" text-anchor="middle" fill="#475569" font-size="12">own implementation, no python-kasa needed</text>
  <!-- plug -->
  <rect x="720" y="250" width="160" height="90" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="800" y="282" text-anchor="middle" font-weight="700">KP125M plug</text>
  <text x="800" y="302" text-anchor="middle" fill="#475569" font-size="12">HTTP port 80 on LAN</text>
  <text x="800" y="320" text-anchor="middle" fill="#475569" font-size="12">no cloud involved</text>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M200,68 L283,82"/>
    <path d="M200,152 L283,92"/>
    <path d="M200,236 L283,100"/>
    <path d="M200,316 L283,310"/>
    <path d="M367,112 L367,130"/>
    <path d="M450,167 L468,167"/>
    <path d="M367,202 L367,220"/>
    <path d="M460,270 L460,284"/>
    <path d="M635,310 L718,298"/>
  </g>
  <polygon points="283.0,82.0 272.4,84.8 273.9,75.9" fill="#475569" stroke="none"/>
  <polygon points="283.0,92.0 277.5,101.5 272.3,94.2" fill="#475569" stroke="none"/>
  <polygon points="283.0,100.0 281.6,110.9 273.9,106.2" fill="#475569" stroke="none"/>
  <polygon points="283.0,310.0 273.4,315.2 272.7,306.2" fill="#475569" stroke="none"/>
  <polygon points="367.0,130.0 362.5,120.0 371.5,120.0" fill="#475569" stroke="none"/>
  <polygon points="468.0,167.0 458.0,171.5 458.0,162.5" fill="#475569" stroke="none"/>
  <polygon points="367.0,220.0 362.5,210.0 371.5,210.0" fill="#475569" stroke="none"/>
  <polygon points="460.0,284.0 455.5,274.0 464.5,274.0" fill="#475569" stroke="none"/>
  <polygon points="718.0,298.0 708.7,303.9 707.5,295.0" fill="#475569" stroke="none"/>
  <polygon points="635.0,310.0 644.3,304.1 645.5,313.0" fill="#475569" stroke="none"/>
</svg>
