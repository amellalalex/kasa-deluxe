<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#fff"/>
  <rect x="60" y="14" width="200" height="40" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="39" text-anchor="middle" font-weight="700" font-size="14">kasadeluxe</text>
  <rect x="640" y="14" width="200" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="740" y="39" text-anchor="middle" font-weight="700" font-size="14">KP125M</text>
  <g stroke="#94a3b8" stroke-dasharray="4 4"><line x1="160" y1="54" x2="160" y2="455"/><line x1="740" y1="54" x2="740" y2="455"/></g>
  <g stroke="#334155" stroke-width="1.6">
    <line x1="160" y1="90" x2="736" y2="90"/>
    <line x1="740" y1="130" x2="164" y2="130"/>
    <line x1="160" y1="185" x2="736" y2="185"/>
    <line x1="740" y1="225" x2="164" y2="225"/>
    <line x1="160" y1="290" x2="736" y2="290"/>
    <line x1="740" y1="330" x2="164" y2="330"/>
    <line x1="160" y1="405" x2="736" y2="405"/>
    <line x1="740" y1="440" x2="164" y2="440"/>
  </g>
  <text x="450" y="82" text-anchor="middle" font-weight="600">1. discover (no password)</text>
  <text x="450" y="122" text-anchor="middle">supported PAKE types, MAC, md5(owner email)</text>
  <text x="200" y="152" fill="#b45309" font-size="12">Check: owner hash matches the configured email, otherwise stop</text>
  <text x="450" y="177" text-anchor="middle" font-weight="600">2. pake_register · client random</text>
  <text x="450" y="217" text-anchor="middle">device random, salt, PBKDF2 iterations, SPAKE2+ share Y, cipher suite</text>
  <text x="200" y="256" fill="#475569" font-size="12">Client derives w0/w1 from the password (PBKDF2-SHA256), computes X, Z, V</text>
  <text x="450" y="282" text-anchor="middle" font-weight="600">3. pake_share · share X + confirmation</text>
  <text x="450" y="322" text-anchor="middle">device confirmation + session token (stok) + start sequence</text>
  <text x="200" y="362" fill="#475569" font-size="12">Both sides now hold the same key; the password itself never crossed the network</text>
  <text x="200" y="378" fill="#b45309" font-size="12">If the plug rejects step 3, no automatic retry (avoids lockout)</text>
  <text x="450" y="397" text-anchor="middle" font-weight="600">4. POST /stok=.../ds · seq || AES-CCM(JSON command)</text>
  <text x="450" y="432" text-anchor="middle">seq || AES-CCM(JSON reply)</text>
